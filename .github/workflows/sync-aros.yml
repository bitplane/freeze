name: Sync AROS package

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      AROS_PKG_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Freeze release tag, for example 2.5.20260924
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    concurrency:
      group: aros-pkg-bitplane
      queue: max
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Check signing key
        env:
          AROS_PKG_KEY: ${{ secrets.AROS_PKG_KEY }}
        run: test -n "$AROS_PKG_KEY"
      - name: Download published archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in v[0-9]*|[0-9]*) ;; *) exit 1 ;; esac
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'freeze-*-aros.tar.bz2' --dir dist
          test "$(find dist -name 'freeze-*-aros.tar.bz2' | wc -l)" -eq 3
      - name: Build pkg
        run: |
          pkg_source="$RUNNER_TEMP/aros-pkg"
          git init "$pkg_source"
          git -C "$pkg_source" fetch --depth=1 https://github.com/jonx/aros-pkg.git a7cb77b6843205ebeca3997adaeebdfc626aab2e
          git -C "$pkg_source" checkout --detach FETCH_HEAD
          make -C "$pkg_source" build/pkg CFLAGS="-std=c99 -Wall -Wextra -Werror -Wno-error=restrict -O2"
      - name: Sign and publish
        env:
          AROS_PKG_KEY: ${{ secrets.AROS_PKG_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          umask 077
          export PKG_SIGNKEY="$RUNNER_TEMP/aros-pkg.key"
          trap 'rm -f "$PKG_SIGNKEY"' EXIT
          printf '%s' "$AROS_PKG_KEY" > "$PKG_SIGNKEY"
          unset AROS_PKG_KEY
          export PKG="$RUNNER_TEMP/aros-pkg/build/pkg"
          sh scripts/aros/publish.sh "$TAG" dist/freeze-*-aros.tar.bz2
      - name: Report sync failure
        if: failure()
        run: |
          echo '::warning::AROS pkg sync failed. GitHub release assets remain available; retry with the Sync AROS package workflow.'
          echo 'Pkg sync failed. Retry **Sync AROS package** with this release tag; no rebuild is needed.' >> "$GITHUB_STEP_SUMMARY"
